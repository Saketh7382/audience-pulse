[build-system]
requires = ["setuptools==69.2.0", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muvion-audience-pulse"
version = "0.1.0"
description = "Evidence-backed audience intelligence analyzer for Muvion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.13.1",
  "asyncpg==0.29.0",
  "httpx==0.27.0",
  "pydantic==2.6.4",
  "pydantic-settings==2.2.1",
  "redis[hiredis]==5.0.3",
  "sqlalchemy[asyncio]==2.0.28",
]

[project.optional-dependencies]
dev = [
  "black==24.2.0",
  "flake8==7.0.0",
  "pytest==8.1.1",
  "pytest-asyncio==0.23.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

